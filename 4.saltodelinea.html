<!DOCTYPE html>
<!--  tipo de documento como HTML5 -->
<html lang="en">

<head>
    <!-- permite que ponga letras especiales -->
    <meta charset="UTF-8">
    <!-- se adapta a dispositivos moviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo que se muestra en la pestaña del navegador -->
    <title>Salto de linea en HTML</title>
</head>

<body>
    <!-- encabezado de la pagina -->
    <h1>Lenguaje de programacion</h1>

    <!-- parrafo que describre -->
    <p>En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:
        <!-- la etiqueta de br produce salto de linea -->
        <br>
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
</body>

</html>
